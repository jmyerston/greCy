## Publishing to GitHub

  - name: publish
    help: "Create (or update) the GitHub release v${vars.package_version}: release notes with each packaged model's test scores and README (scripts/release_notes.py); upload this version's model wheels"
    script:
      - "python scripts/release_notes.py ${vars.package_version} packages/RELEASE_NOTES.md"
      - "bash -c \"gh release create v${vars.package_version} --title 'greCy v${vars.package_version}' --notes-file packages/RELEASE_NOTES.md ${vars.release_flags} || gh release edit v${vars.package_version} --notes-file packages/RELEASE_NOTES.md\""
      - "bash -c \"gh release upload v${vars.package_version} packages/*-${vars.package_version}/dist/*.whl --clobber\""

## Cleaning Up

  - name: clean-spring
    help: "Clean directories"
    script:
      - "rm -rf packages"
      - "rm -rf training"

  - name: clean-all
    help: "Clean directories"
    script:
      - "rm -rf packages"
      - "rm -rf training"
      - "rm -rf vectors"
