title: "Ancient Greek PROIEL and PERSEUS MODELS"
description: "This project trains seven spaCy models using the ancient Greek Universal Dependency treebanks Proiel and Perseus."
email: "jmyerston@ucsd.edu"
source: "https://universaldependencies.org/"
vars:
  license: "MIT"
  author: "Jacobo Myerston"
  config_sm: "small"
  config_lg: "large"
  config_trf: "transformer"
  config_ntrf: "transformer_ner"
  config_lemma_trf: "lemmatizer_trf"
  config_distilbertides_trf: "lemmatizer_distilbertides_hub"
  lang: "grc"
  treebank_proiel: "UD_Ancient_Greek-PROIEL"
  treebank_perseus: "UD_Ancient_Greek-Perseus"
  vectors_lg: "grc_floret_cbow_nn2_xn10_b200k_dim300.floret"
  train_name_proiel: "grc_proiel-ud-train"
  dev_name_proiel: "grc_proiel-ud-dev"
  test_name_proiel: "grc_proiel-ud-test"
  train_name_perseus: "grc_perseus-ud-train"
  dev_name_perseus: "grc_perseus-ud-dev"
  test_name_perseus: "grc_perseus-ud-test"
  pack_name_proiel: "proiel"
  pack_name_perseus: "perseus"
  pack_name_ner: "ner"
  # commit of https://github.com/jmyerston/NEReus that preprocess-ner downloads
  nereus_ref: "7318b059931c05a7f265dc16f19fe329f37af3b9"

  package_version: 3.8.18a1
  # pymorpheus is not on PyPI: the large and transformer models require the wheel of its GitHub release
  pymorpheus_req: "pymorpheus @ https://github.com/jmyerston/pymorpheus/releases/download/v0.1.0.dev0/pymorpheus-0.1.0.dev0-py3-none-any.whl"
  # transformer weights are saved without embeddings.position_ids (transformers >= 4.31)
  transformers_req: "transformers>=4.31.0,<4.50.0"
  # extra flags for `gh release create` (empty for a final release)
  release_flags: "--prerelease"
  gpu: 0

# These are the directories that the project needs. The project CLI will make
# sure that they always exist.
directories: ["assets", "corpus","training", "configs", "packages", "vectors", "metrics"]

assets:

 - dest: 'assets/${vars.treebank_proiel}'
   description: 'Ancient Greek PROIEL UD treebank (https://github.com/jmyerston/UD_Ancient_Greek-PROIEL), distributed with greCy'

 - dest: 'assets/${vars.treebank_perseus}'
   description: 'Ancient Greek Perseus UD treebank (https://github.com/jmyerston/UD_Ancient_Greek-Perseus), distributed with greCy'

 - dest: 'assets/${vars.vectors_lg}'
   url: 'https://zenodo.org/record/5733373/files/grc_floret_cbow_nn2_xn10_b200k_dim300.floret'


workflows:
  all:
    - preprocess
    - preprocess-ner
    - train-transformer-ner
    - train-small-proiel
    - train-small-perseus
    - train-large-proiel
    - train-large-perseus
    - train-transformer-proiel
    - train-transformer-perseus
    - evaluate-small-proiel
    - evaluate-small-perseus
    - evaluate-large-proiel
    - evaluate-large-perseus
    - evaluate-transformer-proiel
    - evaluate-transformer-perseus
    - evaluate-transformer-ner
    - pack-small-proiel
    - pack-small-perseus
    - pack-large-proiel
    - pack-large-perseus
    - pack-transformer-proiel
    - pack-transformer-perseus
    - pack-transformer-ner

commands:

  - name: preprocess
    help: "Convert the data to spaCy's format"
    script:
      - "mkdir -p vectors/large"
      - "mkdir -p corpus/parser/proiel/test corpus/parser/perseus/test"
      - "python -m spacy convert assets/${vars.treebank_proiel}/${vars.train_name_proiel}.conllu corpus/parser/proiel/train --converter conllu --n-sents 10 --merge-subtokens"
      - "python -m spacy convert assets/${vars.treebank_proiel}/${vars.dev_name_proiel}.conllu corpus/parser/proiel/dev --converter conllu --n-sents 10 --merge-subtokens"
      - "python -m spacy convert assets/${vars.treebank_proiel}/${vars.test_name_proiel}.conllu corpus/parser/proiel/test --converter conllu --n-sents 10 --merge-subtokens"
      - "python -m spacy convert assets/${vars.treebank_perseus}/${vars.train_name_perseus}.conllu corpus/parser/perseus/train --converter conllu --n-sents 10 --merge-subtokens"
      - "python -m spacy convert assets/${vars.treebank_perseus}/${vars.dev_name_perseus}.conllu corpus/parser/perseus/dev --converter conllu --n-sents 10 --merge-subtokens"
      - "python -m spacy convert assets/${vars.treebank_perseus}/${vars.test_name_perseus}.conllu corpus/parser/perseus/test --converter conllu --n-sents 10 --merge-subtokens"
      - "python -m spacy init vectors ${vars.lang} assets/${vars.vectors_lg} ./vectors/large --mode floret"

    deps:
      - "assets/${vars.treebank_proiel}/${vars.train_name_proiel}.conllu"
      - "assets/${vars.treebank_proiel}/${vars.dev_name_proiel}.conllu"
      - "assets/${vars.treebank_proiel}/${vars.test_name_proiel}.conllu"
      - "assets/${vars.treebank_perseus}/${vars.train_name_perseus}.conllu"
      - "assets/${vars.treebank_perseus}/${vars.dev_name_perseus}.conllu"
      - "assets/${vars.treebank_perseus}/${vars.test_name_perseus}.conllu"

    outputs:
      - "corpus/parser/proiel/train/grc_proiel-ud-train.spacy"
      - "corpus/parser/proiel/dev/grc_proiel-ud-dev.spacy"
      - "corpus/parser/proiel/test/grc_proiel-ud-test.spacy"
      - "corpus/parser/perseus/train/grc_perseus-ud-train.spacy"
      - "corpus/parser/perseus/dev/grc_perseus-ud-dev.spacy"
      - "corpus/parser/perseus/test/grc_perseus-ud-test.spacy"
      - "vectors/${vars.vectors_lg}"

  - name: preprocess-ner
    help: "Download the NEReus corpus from GitHub, convert it to spaCy's format and add it to the corpora of the small and large models"
    script:
      - "mkdir -p assets/nereus corpus/ner/train corpus/ner/dev corpus/parser/proiel/train corpus/parser/proiel/dev corpus/parser/perseus/train corpus/parser/perseus/dev"
      - "curl -fsSL https://raw.githubusercontent.com/jmyerston/NEReus/${vars.nereus_ref}/corpus/nereus_train.ner -o assets/nereus/nereus_train.ner"
      - "curl -fsSL https://raw.githubusercontent.com/jmyerston/NEReus/${vars.nereus_ref}/corpus/nereus_dev.ner -o assets/nereus/nereus_dev.ner"
      - "python -m spacy convert assets/nereus/nereus_train.ner corpus/ner/train --converter ner"
      - "python -m spacy convert assets/nereus/nereus_dev.ner corpus/ner/dev --converter ner"
      - "cp corpus/ner/train/nereus_train.spacy corpus/parser/proiel/train/ner_train.spacy"
      - "cp corpus/ner/dev/nereus_dev.spacy corpus/parser/proiel/dev/ner_dev.spacy"
      - "cp corpus/ner/train/nereus_train.spacy corpus/parser/perseus/train/ner_train.spacy"
      - "cp corpus/ner/dev/nereus_dev.spacy corpus/parser/perseus/dev/ner_dev.spacy"
    outputs:
      - "assets/nereus/nereus_train.ner"
      - "assets/nereus/nereus_dev.ner"
      - "corpus/ner/train/nereus_train.spacy"
      - "corpus/ner/dev/nereus_dev.spacy"
      - "corpus/parser/proiel/train/ner_train.spacy"
      - "corpus/parser/proiel/dev/ner_dev.spacy"
      - "corpus/parser/perseus/train/ner_train.spacy"
      - "corpus/parser/perseus/dev/ner_dev.spacy"

### Training NER pipelines

  - name: train-transformer-ner
    help: "Train ${vars.treebank_proiel}"
    script:
      - "mkdir -p training/transformer/ner"
      - "python -m spacy train configs/${vars.config_ntrf}.cfg --output training/transformer/ner --gpu-id ${vars.gpu} --paths.train corpus/ner/train/nereus_train.spacy --paths.dev corpus/ner/dev/nereus_dev.spacy --nlp.lang=${vars.lang}"
    deps:
      - "corpus/ner/train/nereus_train.spacy"
      - "corpus/ner/dev/nereus_dev.spacy"
      - "configs/${vars.config_ntrf}.cfg"
    outputs:
      - "training/transformer/ner"

## Training Parsers

  - name: train-small-proiel
    help: "Train ${vars.treebank_proiel}"
    script:
      - "mkdir -p training/small/proiel"
      - "python -m spacy train configs/${vars.config_sm}.cfg --output training/small/proiel --gpu-id ${vars.gpu} --paths.train corpus/parser/proiel/train --paths.dev corpus/parser/proiel/dev --nlp.lang=${vars.lang} --code scripts/custom_functions.py"
    deps:
      - "corpus/parser/proiel/train/grc_proiel-ud-train.spacy"
      - "corpus/parser/proiel/train/ner_train.spacy"
      - "corpus/parser/proiel/dev/grc_proiel-ud-dev.spacy"
      - "corpus/parser/proiel/dev/ner_dev.spacy"
      - "configs/${vars.config_sm}.cfg"
    outputs:
      - "training/small/proiel"

  - name: train-small-perseus
    help: "Train ${vars.treebank_perseus}"
    script:
      - "mkdir -p training/small/perseus"
      - "python -m spacy train configs/${vars.config_sm}.cfg --output training/small/perseus --gpu-id ${vars.gpu} --paths.train corpus/parser/perseus/train --paths.dev corpus/parser/perseus/dev --nlp.lang=${vars.lang} --code scripts/custom_functions.py"
    deps:
      - "corpus/parser/perseus/train/grc_perseus-ud-train.spacy"
      - "corpus/parser/perseus/train/ner_train.spacy"
      - "corpus/parser/perseus/dev/grc_perseus-ud-dev.spacy"
      - "corpus/parser/perseus/dev/ner_dev.spacy"
      - "configs/${vars.config_sm}.cfg"
    outputs:
      - "training/small/perseus"

  - name: train-large-proiel
    help: "Train ${vars.treebank_proiel}"
    script:
      - "mkdir -p training/large/proiel"
      - "python -m spacy train configs/${vars.config_lg}.cfg --output training/large/proiel --gpu-id ${vars.gpu} --paths.train corpus/parser/proiel/train --paths.dev corpus/parser/proiel/dev --paths.vectors vectors/large --nlp.lang=${vars.lang} --code scripts/custom_functions.py"
    deps:
      - "corpus/parser/proiel/train/grc_proiel-ud-train.spacy"
      - "corpus/parser/proiel/train/ner_train.spacy"
      - "corpus/parser/proiel/dev/grc_proiel-ud-dev.spacy"
      - "corpus/parser/proiel/dev/ner_dev.spacy"
      - "configs/${vars.config_lg}.cfg"
    outputs:
      - "training/large/proiel"

  - name: train-large-perseus
    help: "Train ${vars.treebank_perseus}"
    script:
      - "mkdir -p training/large/perseus"
      - "python -m spacy train configs/${vars.config_lg}.cfg --output training/large/perseus --gpu-id ${vars.gpu} --paths.train corpus/parser/perseus/train --paths.dev corpus/parser/perseus/dev --paths.vectors vectors/large --nlp.lang=${vars.lang} --code scripts/custom_functions.py"
    deps:
      - "corpus/parser/perseus/train/grc_perseus-ud-train.spacy"
      - "corpus/parser/perseus/train/ner_train.spacy"
      - "corpus/parser/perseus/dev/grc_perseus-ud-dev.spacy"
      - "corpus/parser/perseus/dev/ner_dev.spacy"
      - "configs/${vars.config_lg}.cfg"
    outputs:
      - "training/large/perseus"

  - name: train-transformer-proiel
    help: "Train ${vars.treebank_proiel}"
    script:
      - "mkdir -p training/transformer/proiel"
      - "python -m spacy train configs/${vars.config_trf}.cfg --output training/transformer/proiel --gpu-id ${vars.gpu} --paths.train corpus/parser/proiel/train/grc_proiel-ud-train.spacy --paths.dev corpus/parser/proiel/dev/grc_proiel-ud-dev.spacy --nlp.lang=${vars.lang} --code scripts/custom_functions.py"
    deps:
      - "corpus/parser/proiel/train/grc_proiel-ud-train.spacy"
      - "corpus/parser/proiel/dev/grc_proiel-ud-dev.spacy"
      - "configs/${vars.config_trf}.cfg"
    outputs:
      - "training/transformer/proiel"

  - name: train-transformer-perseus
    help: "Train ${vars.treebank_perseus}"
    script:
      - "mkdir -p training/transformer/perseus"
      - "python -m spacy train configs/${vars.config_trf}.cfg --output training/transformer/perseus --gpu-id ${vars.gpu} --paths.train corpus/parser/perseus/train/grc_perseus-ud-train.spacy --paths.dev corpus/parser/perseus/dev/grc_perseus-ud-dev.spacy --nlp.lang=${vars.lang} --code scripts/custom_functions.py"
    deps:
      - "corpus/parser/perseus/train/grc_perseus-ud-train.spacy"
      - "corpus/parser/perseus/dev/grc_perseus-ud-dev.spacy"
      - "configs/${vars.config_trf}.cfg"
    outputs:
      - "training/transformer/perseus"

### Training Lemmatizer

  - name: train-transformer-lemmatizer
    help: "Train the transformer-based trainable lemmatizer on the GLAUx corpus"
    script:
      - "mkdir -p training/lemmatizer/greCy_lemmatizer"
      - "python -m spacy train configs/${vars.config_lemma_trf}.cfg --output training/lemmatizer/greCy_lemmatizer --gpu-id ${vars.gpu} --paths.train corpus/lemmatizer/train/lemma_train.spacy --paths.dev corpus/lemmatizer/dev/lemma_dev.spacy --nlp.lang=${vars.lang}"
    deps:
      - "corpus/lemmatizer/train/lemma_train.spacy"
      - "corpus/lemmatizer/dev/lemma_dev.spacy"
      - "configs/${vars.config_lemma_trf}.cfg"
    outputs:
      - "training/lemmatizer/greCy_lemmatizer"

  - name: train-distilbertides-lemmatizer
    help: "Train the transformer-based trainable lemmatizer on Jacobo/distilBERTides"
    script:
      - "mkdir -p training/lemmatizer/distilbertides"
      - "python -m spacy train configs/${vars.config_distilbertides_trf}.cfg --output training/lemmatizer/distilbertides --gpu-id ${vars.gpu} --paths.train corpus/lemmatizer/train/lemma_train.spacy --paths.dev corpus/lemmatizer/dev/lemma_dev.spacy --nlp.lang=${vars.lang}"
    deps:
      - "corpus/lemmatizer/train/lemma_train.spacy"
      - "corpus/lemmatizer/dev/lemma_dev.spacy"
      - "configs/${vars.config_distilbertides_trf}.cfg"
    outputs:
      - "training/lemmatizer/distilbertides"

## Packing

## Benchmarks (held-out test sets; NEReus has no test set, so its dev set)

  - name: evaluate-small-proiel
    help: "Evaluate training/small/proiel/model-best on grc_proiel-ud-test.spacy (the scores go into the package meta and the release notes)"
    script:
      - "python -m spacy evaluate training/small/proiel/model-best corpus/parser/proiel/test/grc_proiel-ud-test.spacy --output metrics/small-proiel.json --code scripts/custom_functions.py --gpu-id ${vars.gpu}"
    deps:
      - "training/small/proiel/model-best"
      - "corpus/parser/proiel/test/grc_proiel-ud-test.spacy"
    outputs:
      - "metrics/small-proiel.json"

  - name: evaluate-small-perseus
    help: "Evaluate training/small/perseus/model-best on grc_perseus-ud-test.spacy (the scores go into the package meta and the release notes)"
    script:
      - "python -m spacy evaluate training/small/perseus/model-best corpus/parser/perseus/test/grc_perseus-ud-test.spacy --output metrics/small-perseus.json --code scripts/custom_functions.py --gpu-id ${vars.gpu}"
    deps:
      - "training/small/perseus/model-best"
      - "corpus/parser/perseus/test/grc_perseus-ud-test.spacy"
    outputs:
      - "metrics/small-perseus.json"

  - name: evaluate-large-proiel
    help: "Evaluate training/large/proiel/model-best on grc_proiel-ud-test.spacy (the scores go into the package meta and the release notes)"
    script:
      - "python -m spacy evaluate training/large/proiel/model-best corpus/parser/proiel/test/grc_proiel-ud-test.spacy --output metrics/large-proiel.json --code scripts/custom_functions.py --gpu-id ${vars.gpu}"
    deps:
      - "training/large/proiel/model-best"
      - "corpus/parser/proiel/test/grc_proiel-ud-test.spacy"
    outputs:
      - "metrics/large-proiel.json"

  - name: evaluate-large-perseus
    help: "Evaluate training/large/perseus/model-best on grc_perseus-ud-test.spacy (the scores go into the package meta and the release notes)"
    script:
      - "python -m spacy evaluate training/large/perseus/model-best corpus/parser/perseus/test/grc_perseus-ud-test.spacy --output metrics/large-perseus.json --code scripts/custom_functions.py --gpu-id ${vars.gpu}"
    deps:
      - "training/large/perseus/model-best"
      - "corpus/parser/perseus/test/grc_perseus-ud-test.spacy"
    outputs:
      - "metrics/large-perseus.json"

  - name: evaluate-transformer-proiel
    help: "Evaluate training/transformer/proiel/model-best on grc_proiel-ud-test.spacy (the scores go into the package meta and the release notes)"
    script:
      - "python -m spacy evaluate training/transformer/proiel/model-best corpus/parser/proiel/test/grc_proiel-ud-test.spacy --output metrics/transformer-proiel.json --code scripts/custom_functions.py --gpu-id ${vars.gpu}"
    deps:
      - "training/transformer/proiel/model-best"
      - "corpus/parser/proiel/test/grc_proiel-ud-test.spacy"
    outputs:
      - "metrics/transformer-proiel.json"

  - name: evaluate-transformer-perseus
    help: "Evaluate training/transformer/perseus/model-best on grc_perseus-ud-test.spacy (the scores go into the package meta and the release notes)"
    script:
      - "python -m spacy evaluate training/transformer/perseus/model-best corpus/parser/perseus/test/grc_perseus-ud-test.spacy --output metrics/transformer-perseus.json --code scripts/custom_functions.py --gpu-id ${vars.gpu}"
    deps:
      - "training/transformer/perseus/model-best"
      - "corpus/parser/perseus/test/grc_perseus-ud-test.spacy"
    outputs:
      - "metrics/transformer-perseus.json"

  - name: evaluate-transformer-ner
    help: "Evaluate training/transformer/ner/model-best on nereus_dev.spacy (the scores go into the package meta and the release notes)"
    script:
      - "python -m spacy evaluate training/transformer/ner/model-best corpus/ner/dev/nereus_dev.spacy --output metrics/transformer-ner.json --code scripts/custom_functions.py --gpu-id ${vars.gpu}"
    deps:
      - "training/transformer/ner/model-best"
      - "corpus/ner/dev/nereus_dev.spacy"
    outputs:
      - "metrics/transformer-ner.json"

## Packing models

  - name: pack-small-proiel
    help: "Package training/small/proiel/model-best as a wheel, with its test scores and requirements in the meta"
    script:
      - "rm -f packages/${vars.lang}_${vars.pack_name_proiel}_sm-${vars.package_version}/README.md"
      - "python scripts/write_package_meta.py packages/meta/small-proiel.json --treebank PROIEL --author '${vars.author}' --email jmyerston@ucsd.edu --license ${vars.license} --url https://github.com/jmyerston/greCy --metrics metrics/small-proiel.json"
      - "python -m spacy package training/small/proiel/model-best packages --name ${vars.pack_name_proiel}_sm --version ${vars.package_version} --build wheel --force --code scripts/custom_functions.py --meta-path packages/meta/small-proiel.json"
    deps:
      - "training/small/proiel/model-best"
      - "metrics/small-proiel.json"
    outputs_no_cache:
      - "packages/${vars.lang}_${vars.pack_name_proiel}_sm-${vars.package_version}/dist/${vars.lang}_${vars.pack_name_proiel}_sm-${vars.package_version}-py3-none-any.whl"

  - name: pack-small-perseus
    help: "Package training/small/perseus/model-best as a wheel, with its test scores and requirements in the meta"
    script:
      - "rm -f packages/${vars.lang}_${vars.pack_name_perseus}_sm-${vars.package_version}/README.md"
      - "python scripts/write_package_meta.py packages/meta/small-perseus.json --treebank Perseus --author '${vars.author}' --email jmyerston@ucsd.edu --license ${vars.license} --url https://github.com/jmyerston/greCy --metrics metrics/small-perseus.json"
      - "python -m spacy package training/small/perseus/model-best packages --name ${vars.pack_name_perseus}_sm --version ${vars.package_version} --build wheel --force --code scripts/custom_functions.py --meta-path packages/meta/small-perseus.json"
    deps:
      - "training/small/perseus/model-best"
      - "metrics/small-perseus.json"
    outputs_no_cache:
      - "packages/${vars.lang}_${vars.pack_name_perseus}_sm-${vars.package_version}/dist/${vars.lang}_${vars.pack_name_perseus}_sm-${vars.package_version}-py3-none-any.whl"

  - name: pack-large-proiel
    help: "Package training/large/proiel/model-best as a wheel, with its test scores and requirements in the meta"
    script:
      - "rm -f packages/${vars.lang}_${vars.pack_name_proiel}_lg-${vars.package_version}/README.md"
      - "python scripts/write_package_meta.py packages/meta/large-proiel.json --treebank PROIEL --author '${vars.author}' --email jmyerston@ucsd.edu --license ${vars.license} --url https://github.com/jmyerston/greCy --metrics metrics/large-proiel.json --req '${vars.pymorpheus_req}'"
      - "python -m spacy package training/large/proiel/model-best packages --name ${vars.pack_name_proiel}_lg --version ${vars.package_version} --build wheel --force --code scripts/custom_functions.py --meta-path packages/meta/large-proiel.json"
    deps:
      - "training/large/proiel/model-best"
      - "metrics/large-proiel.json"
    outputs_no_cache:
      - "packages/${vars.lang}_${vars.pack_name_proiel}_lg-${vars.package_version}/dist/${vars.lang}_${vars.pack_name_proiel}_lg-${vars.package_version}-py3-none-any.whl"

  - name: pack-large-perseus
    help: "Package training/large/perseus/model-best as a wheel, with its test scores and requirements in the meta"
    script:
      - "rm -f packages/${vars.lang}_${vars.pack_name_perseus}_lg-${vars.package_version}/README.md"
      - "python scripts/write_package_meta.py packages/meta/large-perseus.json --treebank Perseus --author '${vars.author}' --email jmyerston@ucsd.edu --license ${vars.license} --url https://github.com/jmyerston/greCy --metrics metrics/large-perseus.json --req '${vars.pymorpheus_req}'"
      - "python -m spacy package training/large/perseus/model-best packages --name ${vars.pack_name_perseus}_lg --version ${vars.package_version} --build wheel --force --code scripts/custom_functions.py --meta-path packages/meta/large-perseus.json"
    deps:
      - "training/large/perseus/model-best"
      - "metrics/large-perseus.json"
    outputs_no_cache:
      - "packages/${vars.lang}_${vars.pack_name_perseus}_lg-${vars.package_version}/dist/${vars.lang}_${vars.pack_name_perseus}_lg-${vars.package_version}-py3-none-any.whl"

  - name: pack-transformer-proiel
    help: "Package training/transformer/proiel/model-best as a wheel, with its test scores and requirements in the meta"
    script:
      - "rm -f packages/${vars.lang}_${vars.pack_name_proiel}_trf-${vars.package_version}/README.md"
      - "python scripts/write_package_meta.py packages/meta/transformer-proiel.json --treebank PROIEL --author '${vars.author}' --email jmyerston@ucsd.edu --license ${vars.license} --url https://github.com/jmyerston/greCy --metrics metrics/transformer-proiel.json --req '${vars.pymorpheus_req}' --req '${vars.transformers_req}'"
      - "python -m spacy package training/transformer/proiel/model-best packages --name ${vars.pack_name_proiel}_trf --version ${vars.package_version} --build wheel --force --code scripts/custom_functions.py --meta-path packages/meta/transformer-proiel.json"
    deps:
      - "training/transformer/proiel/model-best"
      - "metrics/transformer-proiel.json"
    outputs_no_cache:
      - "packages/${vars.lang}_${vars.pack_name_proiel}_trf-${vars.package_version}/dist/${vars.lang}_${vars.pack_name_proiel}_trf-${vars.package_version}-py3-none-any.whl"

  - name: pack-transformer-perseus
    help: "Package training/transformer/perseus/model-best as a wheel, with its test scores and requirements in the meta"
    script:
      - "rm -f packages/${vars.lang}_${vars.pack_name_perseus}_trf-${vars.package_version}/README.md"
      - "python scripts/write_package_meta.py packages/meta/transformer-perseus.json --treebank Perseus --author '${vars.author}' --email jmyerston@ucsd.edu --license ${vars.license} --url https://github.com/jmyerston/greCy --metrics metrics/transformer-perseus.json --req '${vars.pymorpheus_req}' --req '${vars.transformers_req}'"
      - "python -m spacy package training/transformer/perseus/model-best packages --name ${vars.pack_name_perseus}_trf --version ${vars.package_version} --build wheel --force --code scripts/custom_functions.py --meta-path packages/meta/transformer-perseus.json"
    deps:
      - "training/transformer/perseus/model-best"
      - "metrics/transformer-perseus.json"
    outputs_no_cache:
      - "packages/${vars.lang}_${vars.pack_name_perseus}_trf-${vars.package_version}/dist/${vars.lang}_${vars.pack_name_perseus}_trf-${vars.package_version}-py3-none-any.whl"

  - name: pack-transformer-ner
    help: "Package training/transformer/ner/model-best as a wheel, with its test scores and requirements in the meta"
    script:
      - "rm -f packages/${vars.lang}_${vars.pack_name_ner}_trf-${vars.package_version}/README.md"
      - "python scripts/write_package_meta.py packages/meta/transformer-ner.json --treebank NEReus --author '${vars.author}' --email jmyerston@ucsd.edu --license ${vars.license} --url https://github.com/jmyerston/greCy --metrics metrics/transformer-ner.json --req '${vars.transformers_req}'"
      - "python -m spacy package training/transformer/ner/model-best packages --name ${vars.pack_name_ner}_trf --version ${vars.package_version} --build wheel --force --code scripts/custom_functions.py --meta-path packages/meta/transformer-ner.json"
    deps:
      - "training/transformer/ner/model-best"
      - "metrics/transformer-ner.json"
    outputs_no_cache:
      - "packages/${vars.lang}_${vars.pack_name_ner}_trf-${vars.package_version}/dist/${vars.lang}_${vars.pack_name_ner}_trf-${vars.package_version}-py3-none-any.whl"

